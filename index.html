<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卫民安 的个人主页</title>
  <style>
    :root {
      --pink-light: #fff0f3;
      --pink-soft: #ffd6e0;
      --pink: #ffb3c6;
      --pink-deep: #ff8fab;
      --pink-dark: #ff6b8a;
      --lavender: #e8d5f5;
      --text: #4a3548;
      --text-light: #7a6578;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.9);
      --shadow: 0 8px 32px rgba(255, 143, 171, 0.15);
      --shadow-hover: 0 12px 40px rgba(255, 143, 171, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #fff0f3 0%, #ffe8ec 25%, #fff0f8 50%, #f5e8ff 75%, #fff0f3 100%);
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 飘落花瓣容器 */
    .petals-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .petal {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      animation: fall linear infinite;
      opacity: 0;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg) scale(1);
        opacity: 0;
      }

      10% {
        opacity: 0.5;
      }

      90% {
        opacity: 0.5;
      }

      100% {
        transform: translateY(110vh) rotate(720deg) scale(0.3);
        opacity: 0;
      }
    }

    /* 主容器 */
    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    /* 淡入动画 */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== Hero ===== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 60px 0;
    }

    .hero-blob {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 182, 193, 0.3), rgba(255, 169, 191, 0.1));
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: blobPulse 8s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes blobPulse {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.15);
      }
    }

    .avatar-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-light), var(--pink-soft));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      font-size: 56px;
      box-shadow: 0 8px 32px rgba(255, 143, 171, 0.3);
      border: 4px solid rgba(255, 255, 255, 0.8);
      transition: transform 0.3s ease;
    }

    .avatar-circle:hover {
      transform: scale(1.08) rotate(5deg);
    }

    .hero-name {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text);
      letter-spacing: 2px;
    }

    .hero-name .hl {
      background: linear-gradient(135deg, var(--pink-dark), #e879a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 20px;
      color: var(--text-light);
      margin-bottom: 16px;
    }

    .hero-desc {
      font-size: 16px;
      color: var(--text-light);
      max-width: 480px;
      margin: 0 auto 28px;
      line-height: 1.8;
    }

    .hero-tags {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 36px;
    }

    .tag {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 14px;
      color: var(--text-light);
      transition: all 0.3s ease;
    }

    .tag:hover {
      background: var(--pink-soft);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(255, 143, 171, 0.2);
    }

    .hero-cta {
      display: inline-block;
      background: linear-gradient(135deg, var(--pink-deep), var(--pink-dark));
      color: white;
      padding: 14px 40px;
      border-radius: 50px;
      font-size: 18px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 24px rgba(255, 107, 138, 0.35);
    }

    .hero-cta:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(255, 107, 138, 0.45);
    }

    /* ===== Sections ===== */
    .section {
      padding: 80px 0;
    }

    .section-title {
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 48px;
      letter-spacing: 2px;
    }

    .title-icon {
      display: inline-block;
      margin-right: 8px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /* ===== About ===== */
    .about-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 36px;
    }

    .about-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .about-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    .about-card-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .about-card h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .about-card p {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.6;
    }

    .about-quote {
      text-align: center;
      padding: 24px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .about-quote p {
      font-size: 18px;
      color: var(--pink-dark);
      font-style: italic;
      letter-spacing: 1px;
    }

    /* ===== Skills ===== */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .skill-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }

    .skill-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .skill-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .skill-icon {
      font-size: 28px;
    }

    .skill-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .skill-bar-bg {
      width: 100%;
      height: 20px;
      background: var(--pink-light);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .skill-bar-fill {
      height: 100%;
      border-radius: 10px;
      position: relative;
      transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      min-width: 40px;
    }

    .skill-percent {
      font-size: 11px;
      font-weight: 700;
      color: white;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* ===== Gallery ===== */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .gallery-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .gallery-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: var(--shadow-hover);
    }

    .gallery-emoji {
      width: 100%;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      background: linear-gradient(135deg, var(--pink-light), var(--lavender));
      transition: all 0.3s ease;
    }

    .gallery-card:hover .gallery-emoji {
      transform: scale(1.15);
    }

    .gallery-info {
      padding: 20px;
    }

    .gallery-info h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .gallery-info p {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.5;
    }

    /* ===== Contact ===== */
    .contact-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .contact-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--pink-soft), var(--pink-dark), var(--lavender));
    }

    .contact-greeting {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--pink-dark), #e879a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .contact-desc {
      font-size: 16px;
      color: var(--text-light);
      line-height: 1.8;
      max-width: 400px;
      margin: 0 auto;
    }

    .contact-links {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 32px 0 28px;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--pink-light), var(--pink-soft));
      border-radius: 50px;
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    .contact-link:hover {
      border-color: var(--pink);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255, 143, 171, 0.25);
    }

    .contact-link-icon {
      font-size: 20px;
    }

    .contact-note {
      font-size: 15px;
      color: var(--text-light);
      letter-spacing: 1px;
    }

    /* ===== Footer ===== */
    .footer {
      text-align: center;
      padding: 40px 24px;
      color: var(--text-light);
      font-size: 14px;
      letter-spacing: 1px;
    }

    .footer p {
      display: inline-block;
      padding: 12px 24px;
      background: var(--card-bg);
      border-radius: 50px;
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 12px rgba(255, 143, 171, 0.1);
    }
  </style>
</head>

<body>

  <!-- 飘落花瓣 -->
  <div id="petals"></div>

  <div class="app">

    <!-- Hero -->
    <header class="hero">
      <div class="hero-blob"></div>
      <div class="hero-content fade-in">
        <div class="avatar-circle">
          <span>🌸</span>
        </div>
        <h1 class="hero-name">
          嗨，我是
          <span class="hl">卫民安</span>
        </h1>
        <p class="hero-subtitle">
          ✨ 看小美女 ✨
        </p>
        <p class="hero-desc">
          每天奖励我看小美女
        </p>
        <div class="hero-tags">
          <span class="tag">❤️ 小美女爱好者</span>
          <span class="tag">🦶 足控</span>
        </div>
        <a href="#contact" class="hero-cta">💌 奖励我看美女 💌</a>
      </div>
    </header>

    <!-- About -->
    <section id="about" class="section fade-in">
      <h2 class="section-title">
        <span class="title-icon">💝</span>
        关于我
      </h2>
      <div class="about-cards">
        <div class="about-card">
          <div class="about-card-icon">💼</div>
          <h3>职业</h3>
          <p>学生 / 开发者</p>
        </div>
        <div class="about-card">
          <div class="about-card-icon">🎂</div>
          <h3>爱好</h3>
          <p>编程 · 看美女 · 摄影 · 玉足</p>
        </div>
        <div class="about-card">
          <div class="about-card-icon">🌟</div>
          <h3>座右铭</h3>
          <p>奖励我看美 ，一天不看浑身难受</p>
        </div>
      </div>
      <div class="about-quote">
        <p>" 奖励我看美 🍰 "</p>
      </div>
    </section>

    <!-- Skills -->
    <section id="skills" class="section fade-in">
      <h2 class="section-title"><span class="title-icon">🛠️</span>技能树</h2>
      <div class="skills-grid" id="skillsGrid"></div>
    </section>

    <!-- Gallery -->
    <section id="gallery" class="section fade-in">
      <h2 class="section-title">
        <span class="title-icon">📷</span>生活碎片
      </h2>
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <!-- Contact -->
    <section id="contact" class="section fade-in">
      <h2 class="section-title">
        <span class="title-icon">💌</span>
        奖励我
      </h2>
      <div class="contact-card">
        <div class="contact-greeting">看小美</div>
        <p class="contact-desc">
          奖励我看小美 🌸
        </p>
        <div class="contact-links">
          <a href="#" class="contact-link">
            <span class="contact-link-icon">❤️</span>
            <span>奖励我看美女</span>
          </a>
        </div>
        <p class="contact-note">✨ 奖励我看美女 ✨</p>
      </div>
    </section>

    <footer class="footer">
      <p>🌸 Made with love · 卫民安的个人空间 🌸</p>
    </footer>

  </div>

  <script>
    // --- 飘落花瓣 ---
    const emojis = ['🌸', '🌷', '💮', '🏵️', '🌺', '💐', '🌼', '🩷', '💖'];
    const petalsEl = document.getElementById('petals');
    for (let i = 0; i < 20; i++) {
      const span = document.createElement('span');
      span.className = 'petal';
      span.textContent = emojis[i % emojis.length];
      span.style.left = Math.random() * 100 + '%';
      span.style.animationDelay = Math.random() * 15 + 's';
      span.style.animationDuration = (8 + Math.random() * 12) + 's';
      span.style.fontSize = (14 + Math.random() * 18) + 'px';
      petalsEl.appendChild(span);
    }

    // --- 技能数据 ---
    const skills = [
      { name: 'React', level: 100, icon: '⚛️', color: '#61DAFB' },
      { name: 'JavaScript', level: 100, icon: '✨', color: '#F7DF1E' },
      { name: 'HTML / CSS', level: 100, icon: '🎨', color: '#E34F26' },
      { name: 'Node.js', level: 100, icon: '🟢', color: '#339933' },
      { name: 'TypeScript', level: 100, icon: '📘', color: '#3178C6' },
      { name: 'Python', level: 100, icon: '🐍', color: '#3776AB' },
    ];
    const skillsGrid = document.getElementById('skillsGrid');
    skills.forEach(s => {
      const card = document.createElement('div');
      card.className = 'skill-card';
      card.innerHTML = `
    <div class="skill-header">
      <span class="skill-icon">${s.icon}</span>
      <span class="skill-name">${s.name}</span>
    </div>
    <div class="skill-bar-bg">
      <div class="skill-bar-fill" style="width:${s.level}%; background:linear-gradient(90deg, ${s.color}88, ${s.color})">
        <span class="skill-percent">${s.level}%</span>
      </div>
    </div>`;
      skillsGrid.appendChild(card);
    });

    // --- 生活碎片 ---
    const images = [
      { emoji: '🌸', title: '春日花见', desc: '每年最期待的季节' },
      { emoji: '🍰', title: '甜点时光', desc: '烘焙是治愈的方式' },
      { emoji: '📚', title: '阅读角落', desc: '咖啡馆里的下午' },
      { emoji: '🌅', title: '日落时分', desc: '傍晚最美' },
      { emoji: '💻', title: '代码日常', desc: '敲出优雅的解决方案' },
      { emoji: '☕', title: '咖啡', desc: '完美的周末配方' },
    ];
    const galleryGrid = document.getElementById('galleryGrid');
    images.forEach(img => {
      const card = document.createElement('div');
      card.className = 'gallery-card';
      card.innerHTML = `
    <div class="gallery-emoji">${img.emoji}</div>
    <div class="gallery-info">
      <h3>${img.title}</h3>
      <p>${img.desc}</p>
    </div>`;
      galleryGrid.appendChild(card);
    });

    // --- 滚动淡入 ---
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>

</body>

</html>
