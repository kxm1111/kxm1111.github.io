<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 标签页图标 -->
    <link rel="icon" href="/favicon.ico">
    <!-- 标签页标题 -->
    <title>🌸 小安同学的个人网页 🌸</title>
    <!-- 样式 -->
    <style>
        /* 清空浏览器所有样式 */
        * {
            /* 外边距 */
            margin: 0;
            /* 内边距 */
            padding: 0;
            /* 包含边框盒子 */
            box-sizing: border-box;
        }

        /* 身体 */
        body {
            /* 字体 */
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            /* 背景 */
            background: linear-gradient(135deg, #ffd6e8 0%, #ffeef6 50%, #f8d0e5 100%);
            /* 最小高度 */
            min-height: 100vh;
            /* 弹性布局 */
            display: flex;
            /* 水平居中 */
            justify-content: center;
            /* 垂直居中 */
            align-items: center;
            /* 横向文字超过隐藏 */
            overflow-x: hidden;
        }

        /* 飘落花瓣动画 */
        .petal {
            /* 定位 */
            position: fixed;
            /* 宽度 */
            width: 15px;
            /* 高度 */
            height: 15px;
            /* 背景 */
            background: rgba(255, 182, 206, 0.7);
            /* 圆角 */
            border-radius: 50% 0 50% 0;
            /* 动画 */
            animation: fall linear infinite;
            /* 层级 */
            z-index: 0;
        }

        /* 自定义动画 */
        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 0.8;
            }

            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 主体 */
        .container {
            /* 文字居中 */
            text-align: center;
            /* 内边距 */
            padding: 40px 30px;
            /* 背景 */
            background: rgba(255, 255, 255, 0.75);
            /* 圆角 */
            border-radius: 30px;
            /*  */
            backdrop-filter: blur(10px);
            /* 盒子 */
            box-shadow: 0 8px 32px rgba(255, 150, 190, 0.2);
            /* 最大宽度 */
            max-width: 420px;
            /* 宽度 */
            width: 90%;
            /* 相对定位 */
            position: relative;
            /* 层级 */
            z-index: 1;
            /* 动画 */
            animation: fadeIn 0.8s ease;
        }

        /* 自定义动画 */
        @keyframes fadeIn {

            /* 从 */
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            /* 到 */
            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* 圆形头像 */
        .avatar {
            /* 宽度 */
            width: 130px;
            /* 高度 */
            height: 130px;
            /* 圆角 */
            border-radius: 50%;
            /* 背景 */
            background: linear-gradient(135deg, #ff9ec4, #ffb3d6);
            /* 弹性布局 */
            display: flex;
            /* 水平居中 */
            justify-content: center;
            /* 垂直居中 */
            align-items: center;
            /* 外边距 */
            margin: 0 auto 20px;
            /* 盒子阴影 */
            box-shadow: 0 4px 20px rgba(255, 140, 180, 0.4);
            /* 边框 */
            border: 4px solid rgba(255, 255, 255, 0.9);
            /*  */
            transition: transform 0.3s ease;
        }

        /* 圆形头像鼠标悬停 */
        .avatar:hover {
            transform: scale(1.08);
        }

        /* 姓名 */
        .avatar-text {
            /* 字体大小 */
            font-size: 36px;
            /* 字体权重 */
            font-weight: bold;
            /* 字体颜色 */
            color: #fff;
            /* 字体阴影 */
            text-shadow: 0 2px 8px rgba(255, 100, 150, 0.3);
            /* 字距调整 */
            letter-spacing: 4px;
        }

        /* 名字 */
        .name {
            /* 字体大小 */
            font-size: 26px;
            /* 字体权重 */
            font-weight: bold;
            /* 字体颜色 */
            color: #e8548a;
            /* 外边距 下 */
            margin-bottom: 6px;
            /* 字体阴影 */
            text-shadow: 0 1px 3px rgba(255, 182, 206, 0.5);
        }

        /* 签名 */
        .bio {
            /* 字体大小 */
            font-size: 14px;
            /* 字体颜色 */
            color: #c95d85;
            /* 外边距 下 */
            margin-bottom: 24px;
            /* 行高 */
            line-height: 1.8;
        }

        /* 个人介绍板块 */
        .intro {
            /* 背景 */
            background: linear-gradient(135deg, rgba(255, 182, 206, 0.2), rgba(255, 210, 230, 0.3));
            /* 圆角 */
            border-radius: 20px;
            /* 内边距 */
            padding: 20px 18px;
            /* 外边距 下 */
            margin-bottom: 18px;
            /* 左对齐 */
            text-align: left;
            /* 边框 */
            border: 1.5px solid rgba(255, 182, 206, 0.4);
            /* 动画 */
            animation: fadeIn 1s ease 0.2s both;
        }

        /* 关于我 */
        .intro-title {
            /* 字体大小 */
            font-size: 15px;
            /* 字体权重 */
            font-weight: bold;
            /* 字体颜色 */
            color: #e8548a;
            /* 外边距 下 */
            margin-bottom: 14px;
            /* 文字居中 */
            text-align: center;
        }

        /* 个人介绍单项 */
        .intro-item {
            /* 弹性布局 */
            display: flex;
            /*  */
            align-items: flex-start;
            /* 外边距 下 */
            margin-bottom: 10px;
            /* 字体大小 */
            font-size: 13.5px;
            /* 字体颜色 */
            color: #b84676;
            /* 行高 */
            line-height: 1.7;
        }

        /* 最后一个 */
        .intro-item:last-child {
            /* 外边距 下 */
            margin-bottom: 0;
        }

        /* 个人介绍图标 */
        .intro-icon {
            /* 外边距 右 */
            margin-right: 8px;
            /*  */
            flex-shrink: 0;
            /* 字体大小 */
            font-size: 15px;
        }

        /* 个人介绍每项 */
        .intro-label {
            /* 字体权重 */
            font-weight: 600;
            /* 字体颜色 */
            color: #d63e72;
            /* 外边距 右 */
            margin-right: 4px;
        }

        /* ===== 技能板块 ===== */
        .skills {
            /* 背景 */
            background: linear-gradient(135deg, rgba(255, 182, 206, 0.15), rgba(255, 210, 230, 0.25));
            /* 圆角 */
            border-radius: 20px;
            /* 内边距 */
            padding: 18px 18px;
            /* 外边距 下 */
            margin-bottom: 26px;
            /* 左对齐 */
            text-align: left;
            /* 边框 */
            border: 1.5px solid rgba(255, 182, 206, 0.35);
            /* 动画 */
            animation: fadeIn 1s ease 0.35s both;
        }

        /* 技能标题 */
        .skills-title {
            /* 字体大小 */
            font-size: 15px;
            /* 字体权重 */
            font-weight: bold;
            /* 字体颜色 */
            color: #e8548a;
            /* 外边距 下 */
            margin-bottom: 14px;
            /* 文字居中 */
            text-align: center;
        }

        /* 技能项 */
        .skill-item {
            /* 外边距 下 */
            margin-bottom: 12px;
        }

        /* 最后一个技能项 */
        .skill-item:last-child {
            /* 外边距 下 */
            margin-bottom: 0;
        }

        /* 技能头 */
        .skill-header {
            /* 弹性布局 */
            display: flex;
            /*  */
            justify-content: space-between;
            /* 垂直居中 */
            align-items: center;
            /* 外边距 下 */
            margin-bottom: 5px;
        }

        /* 技能名 */
        .skill-name {
            /* 字体大小 */
            font-size: 13.5px;
            /* 字体权重 */
            font-weight: 600;
            /* 字体颜色 */
            color: #d63e72;
        }

        /* 技能百分比 */
        .skill-percent {
            /* 字体大小 */
            font-size: 12px;
            /* 字体颜色 */
            color: #c95d85;
        }

        /* 技能进度条 */
        .skill-bar {
            /* 宽度 */
            width: 100%;
            /* 高度 */
            height: 10px;
            /* 背景 */
            background: rgba(255, 182, 206, 0.3);
            /* 圆角 */
            border-radius: 10px;
            /* 超过时隐藏 */
            overflow: hidden;
        }

        /* 技能进度条 */
        .skill-fill {
            /* 高度 */
            height: 100%;
            /* 圆角 */
            border-radius: 10px;
            /*  */
            transition: width 1.5s ease;
            /* 动画 */
            animation: fillBar 1.5s ease 0.6s both;
        }

        /* python */
        .skill-fill.python {
            /* 宽度 */
            width: 80%;
            /* 背景 */
            background: linear-gradient(90deg, #ff9ec4, #ffb3d6);
        }

        /* java */
        .skill-fill.java {
            /* 宽度 */
            width: 70%;
            /* 背景 */
            background: linear-gradient(90deg, #ff8ab8, #ffc4e0);
        }

        /* 自定义动画 */
        @keyframes fillBar {
            from {
                width: 0;
            }
        }

        /* 底部 */
        .footer {
            /* 外边距 上 */
            margin-top: 8px;
            /* 字体大小 */
            font-size: 12px;
            /* 字体颜色 */
            color: #d88aaa;
        }

        /* 装饰爱心 */
        .heart {
            /* 绝对定位 */
            position: absolute;
            /* 字体大小 */
            font-size: 20px;
            /* 动画 */
            animation: float 3s ease-in-out infinite;
            /*  */
            opacity: 0.6;
        }

        /* 装饰爱心 1 */
        .heart:nth-child(1) {
            /* 上 */
            top: -15px;
            /* 左 */
            left: 20px;
            /*  */
            animation-delay: 0s;
        }

        /* 装饰爱心 2 */
        .heart:nth-child(2) {
            /* 上 */
            top: 10px;
            /* 右 */
            right: 15px;
            /*  */
            animation-delay: 1s;
            /* 字体大小 */
            font-size: 16px;
        }

        /* 装饰爱心 3 */
        .heart:nth-child(3) {
            /* 下 */
            bottom: 60px;
            /* 左 */
            left: 10px;
            /*  */
            animation-delay: 2s;
            /* 字体大小 */
            font-size: 14px;
        }

        /* 自定义动画 */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body>

    <!-- 飘落花瓣 -->
    <script>
        for (let i = 0; i < 12; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
            petal.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(petal);
        }
    </script>

    <!-- 主体 -->
    <div class="container">

        <!-- 装饰爱心 -->
        <span class="heart">💕</span>
        <span class="heart">🌸</span>
        <span class="heart">✨</span>

        <!-- 圆形头像 -->
        <div class="avatar">
            <span class="avatar-text">暗恋</span>
        </div>

        <!-- 名字 -->
        <div class="name">卫民安</div>

        <!-- 个性签名 -->
        <div class="bio">
            每天暗恋美女
        </div>

        <!-- 个人介绍 -->
        <div class="intro">
            <div class="intro-title">🌷 关于我</div>

            <!-- 昵称 -->
            <div class="intro-item">
                <span class="intro-icon">🎀</span>
                <span>
                    <span class="intro-label">昵称：</span>
                    小安同学
                </span>
            </div>

            <!-- 星座 -->
            <div class="intro-item">
                <span class="intro-icon">🌸</span>
                <span>
                    <span class="intro-label">星座：</span>
                    天秤座
                </span>
            </div>

            <!-- 坐标 -->
            <div class="intro-item">
                <span class="intro-icon">📍</span>
                <span>
                    <span class="intro-label">坐标：</span>
                    东莞
                </span>
            </div>

            <!-- 学校 -->
            <div class="intro-item">
                <span class="intro-icon">🏫</span>
                <span>
                    <span class="intro-label">学校：</span>
                    广东酒店管理职业技术学院
                </span>
            </div>

            <!-- 专业 -->
            <div class="intro-item">
                <span class="intro-icon">📚</span>
                <span>
                    <span class="intro-label">专业：</span>
                    软件技术
                </span>
            </div>

            <!-- 班级 -->
            <div class="intro-item">
                <span class="intro-icon">🎓</span>
                <span>
                    <span class="intro-label">班级：</span>
                    24软件2班
                </span>
            </div>

            <!-- 喜欢 -->
            <div class="intro-item">
                <span class="intro-icon">💖</span>
                <span>
                    <span class="intro-label">喜欢：</span>
                    美女、小美女、
                    洛丽塔、萝莉、
                    黑丝、白丝、
                    美腿、美甲脚、高跟鞋
                </span>
            </div>

            <!-- 性格 -->
            <div class="intro-item">
                <span class="intro-icon">✍️</span>
                <span>
                    <span class="intro-label">性格：</span>
                    内向
                </span>
            </div>

            <!-- 循环音乐 -->
            <div class="intro-item">
                <span class="intro-icon">🎵</span>
                <span>
                    <span class="intro-label">最近循环：</span>
                    《珊瑚海》
                </span>
            </div>

        </div>

        <!-- ===== 技能 ===== -->
        <div class="skills">
            <div class="skills-title">💻 我的技能</div>

            <!-- python -->
            <div class="skill-item">
                <!-- 技能头 -->
                <div class="skill-header">
                    <span class="skill-name">🐍 Python</span>
                    <span class="skill-percent">80%</span>
                </div>
                <!-- 进度条 -->
                <div class="skill-bar">
                    <div class="skill-fill python"></div>
                </div>
            </div>

            <!-- java -->
            <div class="skill-item">
                <!-- 技能头 -->
                <div class="skill-header">
                    <span class="skill-name">☕ Java</span>
                    <span class="skill-percent">70%</span>
                </div>
                <!-- 进度条 -->
                <div class="skill-bar">
                    <div class="skill-fill java"></div>
                </div>
            </div>

        </div>

        <!-- 底部 -->
        <div class="footer">
            © 2026 每天暗恋美女 ✿
        </div>

    </div>

</body>

</html>
